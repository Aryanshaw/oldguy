<style>
/* Old Guy Tutor: a warm yellow room, the scene on a near-black board with an orange frame, the new guy on the left
   and the old guy on the right, each on a cream card. The card is drawn twice: a still card with the character
   dimmed (always there), and the engine's speaker element on top of it, full colour with an orange frame, shown only
   while that character speaks. The old guy has two speaker ids on the same card: `oldguy` (thinking with his mug,
   pointing while he talks) and `oldguy-laughs` (for his jokes). A few props from the kit (mug, cap, pencil) dress
   the room, small and off the board; they are inlined below as data URIs by stage-props.mjs, because the engine copies only
   speaker pictures and background footage into a chapter. Edit stage.src.html, then run `node stage-props.mjs`.
   The source chip is a small footnote under the board on the old guy's side (he carries every claim), so it never
   competes with the lit card; one short file:line per claim reads best (the label "SOURCE" sits inside its left edge,
   and a long path, a timing record deep in the video folder, wraps rather than running off).
   Brand palette: yellow #F6C945, orange #FF8A1F, near-black #14110A, cream #FFF1CC, coral #FF6B57. */
#root { background: #F6C945; }
.tu-floor { position: absolute; left: 0; right: 0; bottom: 0; background: #FF8A1F; border-top: 8px solid #14110A; }
.tu-board { position: absolute; box-sizing: border-box; background: #14110A; border: 10px solid #FF8A1F; border-radius: 8px; box-shadow: 0 10px 0 #14110A; }
.tu-card, .og-speaker { position: absolute; box-sizing: border-box; border-radius: 24px; background: #FFF1CC; overflow: hidden; }
.tu-card { border: 6px solid #C9A63A; }
.tu-ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; filter: grayscale(0.5) brightness(0.85); opacity: 0.8; }
.og-speaker { border: 6px solid #FF8A1F; box-shadow: 0 0 0 6px #14110A; }
.og-speaker-talk { background: #FFF1CC; }
.tu-tag { position: absolute; box-sizing: border-box; padding: 6px 16px 8px; border-radius: 12px; background: #14110A; color: #FFF1CC; font: 800 30px var(--og-font); letter-spacing: 0.06em; text-align: center; white-space: nowrap; }
.tu-tag b { color: #F6C945; font-weight: 800; }
.og-chip { position: absolute; box-sizing: border-box; padding: 6px 16px 8px 118px; border-radius: 10px; background: #FFF1CC; color: #14110A; border-left: 8px solid #FF6B57; font: 600 24px/1.3 var(--og-font-mono); font-variant-ligatures: none; white-space: normal; overflow-wrap: anywhere; box-shadow: 0 4px 0 #14110A; }
.og-chip::before { content: "SOURCE"; position: absolute; left: 14px; top: 11px; font: 900 18px var(--og-font); letter-spacing: 0.12em; color: #B8402F; }
.tu-brand { position: absolute; font: 900 40px var(--og-font); color: #14110A; letter-spacing: 0.04em; white-space: nowrap; }
.tu-brand b { color: #FFF1CC; background: #14110A; padding: 0 12px 4px; border-radius: 8px; }
.tu-prop { position: absolute; background-repeat: no-repeat; background-size: contain; background-position: center bottom; filter: drop-shadow(0 6px 0 rgba(20, 17, 10, 0.35)); }
.tu-mug { background-image: url(PROP(mug)); }
.tu-cap { background-image: url(PROP(cap)); }
.tu-pencil { background-image: url(PROP(pencil)); }

/* The scene kit's pieces, made easier to read at the slot's size: bigger labels and code, a readable highlight
   (near-black on yellow, 11.99), and an arrow between neighbouring lanes so the hand-off from one part to the next
   is drawn. */
:root { --og-size-code: 40px; --og-card-w: 1780px; --og-card-h: 900px; }
.og-flow { padding: 40px 48px; gap: 22px; }
.og-flow-title { font-size: 58px; }
.og-flow-kicker { font-size: 28px; }
.og-flow-lanes { gap: 52px; }
.og-lane { padding: 20px 16px; }
.og-lane-head { font-size: 40px; }
.og-lane-steps { gap: 14px; }
.og-flow-step { padding: 14px 14px; gap: 12px; }
.og-flow-num { width: 46px; height: 46px; font-size: 26px; }
.og-flow-label { font-size: 40px; line-height: 1.15; }
.og-flow-detail { font-size: 30px; }
.og-lane + .og-lane::before { content: ""; position: absolute; left: -46px; top: 26px; width: 0; height: 0; border-style: solid; border-width: 20px 0 20px 30px; border-color: transparent transparent transparent #FF8A1F; }
.og-file { font-size: 32px; max-width: none; }
.og-hl { background: #F6C945; color: #14110A; }
.og-hl .og-no { color: #14110A; }

/* 16:9: slot [240, 32, 1380, 776], the board takes three quarters of the width */
[data-shape="16:9"] .tu-floor { height: 170px; }
[data-shape="16:9"] .tu-board { left: 228px; top: 20px; width: 1404px; height: 800px; }
[data-shape="16:9"] .tu-card-left, [data-shape="16:9"] .og-speaker-left { left: 12px; top: 510px; width: 204px; height: 384px; }
[data-shape="16:9"] .tu-card-right, [data-shape="16:9"] .og-speaker-right { left: 1646px; top: 560px; width: 264px; height: 334px; }
[data-shape="16:9"] .tu-tag-left { left: 12px; top: 912px; width: 204px; font-size: 22px; padding: 6px 8px 8px; }
[data-shape="16:9"] .tu-tag-left b, [data-shape="16:9"] .tu-tag-right b { display: none; }
[data-shape="16:9"] .tu-tag-right { left: 1646px; top: 912px; width: 264px; font-size: 26px; }
[data-shape="16:9"] .og-chip { right: 288px; top: 834px; max-width: 1060px; text-align: right; }
[data-shape="16:9"] .tu-mug { left: 1520px; top: 960px; width: 100px; height: 92px; }
[data-shape="16:9"] .tu-pencil { left: 1570px; top: -4px; width: 84px; height: 82px; transform: rotate(18deg); }
[data-shape="16:9"] .tu-cap { left: 250px; top: 970px; width: 104px; height: 76px; transform: rotate(-8deg); }
[data-shape="16:9"] .tu-brand { left: 760px; top: 985px; }

/* 9:16: slot [24, 170, 1032, 580] */
[data-shape="9:16"] .tu-floor { height: 330px; }
[data-shape="9:16"] .tu-brand { left: 24px; top: 56px; font-size: 48px; }
[data-shape="9:16"] .tu-cap { left: 900px; top: 26px; width: 150px; height: 112px; transform: rotate(10deg); }
[data-shape="9:16"] .tu-board { left: 14px; top: 160px; width: 1052px; height: 600px; }
[data-shape="9:16"] .tu-pencil { left: 770px; top: 34px; width: 110px; height: 108px; transform: rotate(-12deg); }
[data-shape="9:16"] .og-chip { left: 24px; top: 800px; max-width: 1032px; }
[data-shape="9:16"] .tu-card-left, [data-shape="9:16"] .og-speaker-left { left: 36px; top: 960px; width: 360px; height: 660px; }
[data-shape="9:16"] .tu-card-right, [data-shape="9:16"] .og-speaker-right { left: 470px; top: 980px; width: 574px; height: 640px; }
[data-shape="9:16"] .tu-tag-left { left: 36px; top: 1652px; width: 360px; }
[data-shape="9:16"] .tu-tag-right { left: 470px; top: 1652px; width: 574px; }
[data-shape="9:16"] .tu-mug { left: 860px; top: 1760px; width: 150px; height: 138px; }

/* 1:1: slot [40, 40, 1360, 765] */
[data-shape="1:1"] .tu-floor { height: 150px; }
[data-shape="1:1"] .tu-board { left: 30px; top: 30px; width: 1380px; height: 785px; }
[data-shape="1:1"] .tu-pencil { left: 1320px; top: -6px; width: 110px; height: 108px; transform: rotate(18deg); }
[data-shape="1:1"] .tu-card-left, [data-shape="1:1"] .og-speaker-left { left: 24px; top: 852px; width: 262px; height: 480px; }
[data-shape="1:1"] .tu-card-right, [data-shape="1:1"] .og-speaker-right { left: 1050px; top: 902px; width: 366px; height: 430px; }
[data-shape="1:1"] .tu-tag-left { left: 24px; top: 1352px; width: 262px; font-size: 26px; }
[data-shape="1:1"] .tu-tag-left b { display: none; }
[data-shape="1:1"] .tu-tag-right { left: 1050px; top: 1352px; width: 366px; font-size: 26px; }
[data-shape="1:1"] .og-chip { left: 310px; top: 862px; max-width: 720px; }
[data-shape="1:1"] .tu-mug { left: 860px; top: 1180px; width: 140px; height: 130px; }
[data-shape="1:1"] .tu-cap { left: 330px; top: 1200px; width: 140px; height: 100px; transform: rotate(-8deg); }
[data-shape="1:1"] .tu-brand { left: 560px; top: 1362px; font-size: 34px; }
</style>
<div class="tu-floor"></div>
<div class="tu-brand">old guy <b>tutor</b></div>
<div class="tu-prop tu-cap"></div>
