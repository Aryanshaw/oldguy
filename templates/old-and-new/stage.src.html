<style>
/* Old Guy & New Guy: the TikTok "brainrot explainer". Looping parkour gameplay fills the frame; the scene sits on a
   near-black board with a yellow frame; the new guy stands on the left, the old guy on the right; the words go up one
   at a time, big and bold on a yellow plate, in the middle.
   Each character is drawn twice. A still "reacting" pose is always there, dimmed and a step back (.oan-ghost). The
   engine's speaker element sits on top of it, hidden between his lines: while he talks it shows his talking pose,
   lit on his own colour card, and bobs. The card covers the ghost, including at the top of a bob (the ghost is inset
   by more than the bob's 14 px). The old guy has two speaker ids on the same card: `oldguy` (talking, pointing) and
   `oldguy-laughs` (laughing, for his jokes).
   Pictures are the oldguy character kit (assets/, see ASSETS.md); the reacting poses and the props are inlined below
   as data URIs by build-stage.mjs, because the engine copies only speaker pictures and background footage into a
   chapter. Edit stage.src.html, then run `node templates/old-and-new/build-stage.mjs`.
   Brand: yellow #F6C945, orange #FF8A1F, near-black #14110A, cream #FFF1CC, coral #FF6B57.
   New guy: lime #C6F432, blue #2D4BFF, off-white #F4F4EF, black #111111, pink #FF7AB6. */
#root { background: #14110A; }
.og-bg-clip { filter: saturate(1.1) brightness(0.82); }
.oan-shade { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(20, 17, 10, 0.38); }
.oan-board { position: absolute; box-sizing: border-box; background: #14110A; border: 10px solid #F6C945; border-radius: 18px; box-shadow: 0 12px 0 #14110A; }
.oan-ghost { position: absolute; background-repeat: no-repeat; background-size: contain; background-position: center bottom; filter: grayscale(0.55) brightness(0.62); opacity: 0.92; }
.oan-ghost-new { background-image: url(PIC(newguy-react)); }
.oan-ghost-old { background-image: url(PIC(oldguy-react)); }
.og-speaker { position: absolute; box-sizing: border-box; border-radius: 28px; border: 8px solid #14110A; box-shadow: 0 10px 0 #14110A; }
.og-speaker img { object-position: center bottom; }
.og-speaker-left { background: #C6F432; }
.og-speaker-right { background: #F6C945; }
.oan-tag { position: absolute; box-sizing: border-box; padding: 6px 18px 10px; border-radius: 14px; border: 6px solid #14110A; font: 900 34px var(--og-font); letter-spacing: 0.04em; text-align: center; white-space: nowrap; box-shadow: 0 6px 0 #14110A; }
.oan-tag-new { background: #2D4BFF; color: #F4F4EF; transform: rotate(-3deg); }
.oan-tag-new b { color: #C6F432; font-weight: 900; }
.oan-tag-old { background: #14110A; color: #FFF1CC; border-color: #FF8A1F; box-shadow: 0 6px 0 #FF8A1F; transform: rotate(3deg); }
.oan-tag-old b { color: #F6C945; font-weight: 900; }
.og-cap { position: absolute; left: 20px; right: 20px; width: fit-content; margin: 0 auto; transform: rotate(-2deg); box-sizing: border-box; padding: 6px 34px 16px; border-radius: 20px; background: #F6C945; color: #14110A; border: 8px solid #14110A; box-shadow: 0 12px 0 #14110A; font: 900 104px/1.05 var(--og-font); text-transform: uppercase; letter-spacing: 0.01em; white-space: nowrap; opacity: 0; }
.og-chip { position: absolute; left: 30px; right: 30px; width: fit-content; margin: 0 auto; box-sizing: border-box; padding: 10px 22px 12px; border-radius: 12px; background: #FFF1CC; color: #14110A; border: 4px solid #14110A; border-left: 14px solid #FF6B57; font: 700 28px/1.25 var(--og-font-mono); font-variant-ligatures: none; white-space: normal; overflow-wrap: anywhere; text-align: center; box-shadow: 0 6px 0 #14110A; }
.og-chip::before { content: "SOURCE  "; font: 900 22px var(--og-font); letter-spacing: 0.12em; color: #B8402F; }
.oan-brand { position: absolute; padding: 4px 16px 8px; border-radius: 12px; background: #14110A; color: #FFF1CC; font: 900 34px var(--og-font); letter-spacing: 0.04em; white-space: nowrap; }
.oan-brand b { color: #F6C945; }
.oan-prop { position: absolute; background-repeat: no-repeat; background-size: contain; background-position: center; filter: drop-shadow(0 6px 0 rgba(20, 17, 10, 0.55)); }
.oan-mug { background-image: url(PIC(props/mug)); }
.oan-cap { background-image: url(PIC(props/cap)); }
.oan-pencil { background-image: url(PIC(props/pencil)); }
.oan-computer { background-image: url(PIC(props/computer)); }
