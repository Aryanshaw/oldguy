<style>
/* Old Guy & New Guy: the TikTok "brainrot explainer", tuned so the board does the teaching. One big board with a yellow
   frame holds the chapter's map; looping Minecraft parkour gameplay keeps moving behind it, toned down so it never
   pulls the eye off the board:
   - the background is the template's looping parkour footage (the engine's .og-bg-clip, at normal speed), darkened,
     desaturated and softly blurred, under a dark shade; the board is opaque, so the footage shows only around it;
   - the new guy (left) and the old guy (right) are small head-and-shoulders speaker icons under the board, dimmed
     and grey while quiet; the engine's speaker element covers the dim one, lit on his own colour, while he talks;
   - the big word on its yellow plate shows only values and code names (a word with a digit, an underscore or a dot
     inside: 520, 3.57, bm_george); the script after the captions marker hides every other word, so filler never
     flashes;
   - no source chips: the board's code card names the file and line it shows.
   The old guy has two speaker ids on the same card: `oldguy` (talking, pointing) and `oldguy-laughs` (laughing).
   Pictures are the oldguy character kit (assets/, see ASSETS.md); the reacting poses are inlined below as data URIs by
   build-stage.mjs, because the engine copies only speaker pictures and background footage into a chapter. Edit
   stage.src.html, then run `node templates/old-and-new/build-stage.mjs`.
   Brand: yellow #F6C945, orange #FF8A1F, near-black #14110A, cream #FFF1CC, coral #FF6B57.
   New guy: lime #C6F432, blue #2D4BFF, off-white #F4F4EF, black #111111, pink #FF7AB6. */
#root { background: #14110A; }
/* the footage keeps moving at normal speed, but dark, grey-ish and soft, so motion reads without detail to track */
.og-bg-clip { filter: brightness(0.5) saturate(0.35) blur(4px); transform: scale(1.04); }
.oan-shade { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(20, 17, 10, 0.45); }
.oan-board { position: absolute; box-sizing: border-box; background: #14110A; border: 10px solid #F6C945; border-radius: 18px; box-shadow: 0 12px 0 #000; }
.oan-ghost { position: absolute; box-sizing: border-box; border-radius: 24px; border: 6px solid #3A3426; background-color: #241F14; background-repeat: no-repeat; background-size: 150% auto; background-position: 50% 4%; filter: grayscale(0.8) brightness(0.5); }
.oan-ghost-new { background-image: url(PIC(newguy-react)); }
.oan-ghost-old { background-image: url(PIC(oldguy-react)); }
.og-speaker { position: absolute; box-sizing: border-box; border-radius: 24px; border: 6px solid #14110A; box-shadow: 0 8px 0 #000; overflow: hidden; }
.og-speaker img { width: 150% !important; height: auto !important; left: -25% !important; top: -2% !important; object-fit: initial !important; }
.og-speaker-left { background: #C6F432; }
.og-speaker-right { background: #F6C945; }
.oan-tag { position: absolute; box-sizing: border-box; padding: 4px 12px 8px; border-radius: 12px; border: 5px solid #14110A; font: 900 30px var(--og-font); letter-spacing: 0.04em; text-align: center; white-space: nowrap; }
.oan-tag-new { background: #2D4BFF; color: #F4F4EF; }
.oan-tag-new b { color: #C6F432; font-weight: 900; }
.oan-tag-old { background: #14110A; color: #FFF1CC; border-color: #FF8A1F; }
.oan-tag-old b { color: #F6C945; font-weight: 900; }
.og-cap { position: absolute; left: 20px; right: 20px; width: fit-content; margin: 0 auto; box-sizing: border-box; padding: 4px 30px 12px; border-radius: 18px; background: #F6C945; color: #14110A; border: 7px solid #14110A; box-shadow: 0 10px 0 #000; font: 900 96px/1.05 var(--og-font); letter-spacing: 0.01em; white-space: nowrap; opacity: 0; }
.oan-brand { position: absolute; padding: 4px 16px 8px; border-radius: 12px; background: #14110A; color: #FFF1CC; font: 900 34px var(--og-font); letter-spacing: 0.04em; white-space: nowrap; }
.oan-brand b { color: #F6C945; }

/* 16:9 (1920 x 1080). Slot [250, 26, 1420, 799]: the board is three quarters of the frame. */
[data-shape="16:9"] .oan-board { left: 240px; top: 16px; width: 1440px; height: 819px; }
[data-shape="16:9"] .oan-ghost-new, [data-shape="16:9"] .og-speaker-left { left: 22px; top: 520px; width: 200px; height: 230px; }
[data-shape="16:9"] .oan-ghost-old, [data-shape="16:9"] .og-speaker-right { left: 1698px; top: 520px; width: 200px; height: 230px; }
[data-shape="16:9"] .oan-tag-new { left: 22px; top: 760px; width: 200px; font-size: 28px; }
[data-shape="16:9"] .oan-tag-old { left: 1698px; top: 760px; width: 200px; font-size: 28px; }
[data-shape="16:9"] .og-cap { top: 868px; font-size: 92px; }
[data-shape="16:9"] .oan-brand { left: 22px; top: 1010px; font-size: 28px; }

/* 9:16 (1080 x 1920). Slot [20, 480, 1040, 585]: the board fills the width, in the middle of the phone. */
[data-shape="9:16"] .oan-brand { left: 20px; top: 396px; font-size: 40px; }
[data-shape="9:16"] .oan-board { left: 10px; top: 470px; width: 1060px; height: 605px; }
[data-shape="9:16"] .og-cap { top: 1110px; font-size: 104px; }
[data-shape="9:16"] .oan-ghost-new, [data-shape="9:16"] .og-speaker-left { left: 40px; top: 1290px; width: 250px; height: 290px; }
[data-shape="9:16"] .oan-ghost-old, [data-shape="9:16"] .og-speaker-right { left: 790px; top: 1290px; width: 250px; height: 290px; }
[data-shape="9:16"] .oan-tag-new { left: 40px; top: 1594px; width: 250px; }
[data-shape="9:16"] .oan-tag-old { left: 790px; top: 1594px; width: 250px; }

/* 1:1 (1440 x 1440). Slot [20, 130, 1400, 788]. */
[data-shape="1:1"] .oan-brand { left: 20px; top: 44px; font-size: 38px; }
[data-shape="1:1"] .oan-board { left: 10px; top: 120px; width: 1420px; height: 808px; }
[data-shape="1:1"] .og-cap { top: 960px; font-size: 92px; }
[data-shape="1:1"] .oan-ghost-new, [data-shape="1:1"] .og-speaker-left { left: 40px; top: 1120px; width: 220px; height: 250px; }
[data-shape="1:1"] .oan-ghost-old, [data-shape="1:1"] .og-speaker-right { left: 1180px; top: 1120px; width: 220px; height: 250px; }
[data-shape="1:1"] .oan-tag-new { left: 40px; top: 1380px; width: 220px; font-size: 28px; }
[data-shape="1:1"] .oan-tag-old { left: 1180px; top: 1380px; width: 220px; font-size: 28px; }
</style>
<!-- oldguy:background -->
<div class="oan-shade"></div>
<div class="oan-board"></div>
<!-- oldguy:slot -->
<div class="oan-ghost oan-ghost-new"></div>
<div class="oan-ghost oan-ghost-old"></div>
<!-- oldguy:speakers -->
<div class="oan-tag oan-tag-new"><b>NEW</b> GUY</div>
<div class="oan-tag oan-tag-old"><b>OLD</b> GUY</div>
<!-- oldguy:captions -->
<script>
/* the big word is for values and code names only: hide every caption word without a digit, an underscore or a dot inside */
document.querySelectorAll('.og-cap-word').forEach(function (el) {
  if (!/[0-9_]|[A-Za-z]\.[A-Za-z]/.test(el.textContent)) el.style.display = 'none';
});
</script>
<div class="oan-brand">old guy <b>&amp;</b> new guy</div>
