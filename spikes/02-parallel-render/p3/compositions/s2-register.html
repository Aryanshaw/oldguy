      // spring a card into place

      function hfSlide(tl, sel, t, dx) {
        tl.fromTo(sel, { opacity: 0, x: dx || -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
      }
      // fade the whole scene in at the start and out before its slot ends
      function hfScene(tl, wrap, dur) {
        tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
        tl.to(wrap, { opacity: 0, duration: 0.5, ease: "power1.in" }, dur - 0.55);
      }
      // carry a labelled packet from one point to another (authored pixel constants)
      function hfPacket(tl, sel, a, b, t, dur) {
        const d = dur || 0.8;
        tl.fromTo(sel, { x: a[0], y: a[1] - 20 }, { x: b[0], y: b[1] - 20, duration: d, ease: "power2.inOut" }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, t);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "none" }, t + d);
      }
      // pulse a card border to show it was just written
      function hfFlash(tl, sel, t, from, to) {
        tl.fromTo(
          sel,
          { borderColor: from || "#3a5f99" },
          { borderColor: to || "#bfe0ff", duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false },
          t,
        );
      }
      // mark a step card active (amber/green border) and release the previous one
      function hfActivate(tl, sel, t, color, until) {
        tl.fromTo(sel, { borderColor: "#2a3d63" }, { borderColor: color, duration: 0.3, ease: "power1.out", immediateRender: false }, t);
        if (until) tl.to(sel, { borderColor: "#2a3d63", duration: 0.3, ease: "power1.in" }, until);
      }

        // scene 2: loader imports -> register(JobSpec) -> registry -> worker functions + boot check
        const tl = gsap.timeline({ paused: true });
        hfScene(tl, "#s2-wrap", 28);
        hfSlide(tl, "#s2-kicker", 0.2, -30);
        hfSlide(tl, "#s2-title", 0.35, -30);

        // the two processes start, both import the loader
        hfPop(tl, "#s2-main", 0.8, { x: -30 });
        hfPop(tl, "#s2-worker", 1.1, { x: -30 });
        hfDraw(tl, "#s2-w-main", 2.0, 0.6);
        hfDraw(tl, "#s2-w-wk", 2.15, 0.6);
        hfPop(tl, "#s2-loader", 2.5);
        tl.fromTo(
          "#s2-loader .s2-line",
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.12 },
          3.2,
        );
        hfSlide(tl, "#s2-jobs-h", 5.2, -20);
        hfSlide(tl, "#s2-jobs-s", 5.35, -20);
        hfPop(tl, "#s2-registry", 5.6, { x: 30 });

        // each import runs register(JobSpec), which fills one registry slot
        const jobs = document.querySelectorAll("#s2-phase1 .s2-job");
        const fills = document.querySelectorAll("#s2-registry .s2-fill");
        for (let i = 0; i < 7; i++) {
          const t = 6.0 + i * 0.55;
          hfDraw(tl, "#s2-l" + i, t, 0.25);
          hfSlide(tl, jobs[i], t + 0.15, -24);
          hfDraw(tl, "#s2-r" + i, t + 0.4, 0.25);
          tl.fromTo(fills[i], { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, t + 0.6);
        }
        hfPop(tl, "#s2-twice", 11.2);

        // phase 2: inputs clear away and the registry slides left to feed its two readers
        tl.to(["#s2-phase1", "#s2-w-main", "#s2-w-wk", "#s2-twice"], { opacity: 0, duration: 0.5, ease: "power1.in" }, 14.3);
        tl.to(
          ["#s2-l0", "#s2-l1", "#s2-l2", "#s2-l3", "#s2-l4", "#s2-l5", "#s2-l6", "#s2-r0", "#s2-r1", "#s2-r2", "#s2-r3", "#s2-r4", "#s2-r5", "#s2-r6"],
          { opacity: 0, duration: 0.5, ease: "power1.in" },
          14.3,
        );
        tl.to("#s2-registry", { x: -1380, duration: 0.9, ease: "power3.inOut" }, 14.6);
        hfDraw(tl, "#s2-w-wf", 15.5, 0.4);
        hfPop(tl, "#s2-wf", 15.7, { x: 30 });
        tl.fromTo(
          "#s2-wf .s2-fn",
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.12 },
          16.3,
        );
        hfSlide(tl, "#s2-wf-foot", 17.6, -20);

        hfDraw(tl, "#s2-w-ac", 19.8, 0.8);
        hfPop(tl, "#s2-ac", 20.3, { x: 30 });
        hfPop(tl, "#s2-ok", 21.2);
        hfPop(tl, "#s2-bad", 22.4);
        // the failing case shakes once to say "boot stops here"
        tl.fromTo("#s2-bad", { x: 0 }, { x: 10, duration: 0.07, yoyo: true, repeat: 5, ease: "power1.inOut" }, 23.1);

        hfCaps(tl, "#s2-wrap");
        window.__timelines["s2-register"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
