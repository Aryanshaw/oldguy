<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Job flow explainer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1426;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1426;
        font-family: Montserrat, sans-serif;
        color: #eaf0fa;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="26"
    >
      <div
        id="bg"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="26"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s6-failure"
        data-composition-id="s6-failure"
        data-composition-src="compositions/s6-failure.html"
        data-start="0"
        data-duration="26"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      // the host timeline only exists to register the film; each scene animates itself
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
