        (function () {
              // fade each caption in at data-in and out at data-out (scene-local seconds)
      function hfCaps(tl, root) {
        document.querySelectorAll(root + " .cap").forEach((c) => {
          const a = parseFloat(c.dataset.in);
          const b = parseFloat(c.dataset.out);
          tl.fromTo(c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, a);
          tl.to(c, { opacity: 0, y: -8, duration: 0.3, ease: "power1.in" }, b - 0.3);
        });
      }
      // draw an svg wire (pathLength=1) from nothing to full
      function hfDraw(tl, sel, t, dur) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur || 0.6, ease: "power2.inOut" }, t);
      }
      // spring a card into place
      function hfPop(tl, sel, t, from) {
        tl.fromTo(
          sel,
          Object.assign({ opacity: 0, scale: 0.9, y: 18 }, from || {}),
          { opacity: 1, scale: 1, y: 0, x: 0, duration: 0.55, ease: "back.out(1.6)" },
          t,
        );
      }
      // slide a row / step in from the left
      function hfSlide(tl, sel, t, dx) {
        tl.fromTo(sel, { opacity: 0, x: dx || -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
      }
      // fade the whole scene in at the start and out before its slot ends
      function hfScene(tl, wrap, dur) {
        tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
        tl.to(wrap, { opacity: 0, duration: 0.5, ease: "power1.in" }, dur - 0.55);
      }
      // carry a labelled packet from one point to another (authored pixel constants)
      function hfPacket(tl, sel, a, b, t, dur) {
        const d = dur || 0.8;
        tl.fromTo(sel, { x: a[0], y: a[1] - 20 }, { x: b[0], y: b[1] - 20, duration: d, ease: "power2.inOut" }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, t);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "none" }, t + d);
      }
      // pulse a card border to show it was just written
      function hfFlash(tl, sel, t, from, to) {
        tl.fromTo(
          sel,
          { borderColor: from || "#3a5f99" },
          { borderColor: to || "#bfe0ff", duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false },
          t,
        );
      }
      // mark a step card active (amber/green border) and release the previous one
      function hfActivate(tl, sel, t, color, until) {
        tl.fromTo(sel, { borderColor: "#2a3d63" }, { borderColor: color, duration: 0.3, ease: "power1.out", immediateRender: false }, t);
        if (until) tl.to(sel, { borderColor: "#2a3d63", duration: 0.3, ease: "power1.in" }, until);
      }

        // scene 4: queue -> get -> pre_claim -> claim -> load + commit -> span/progress/heartbeat -> execute
        const tl = gsap.timeline({ paused: true });
        const GREEN = "#3ed598";
        hfScene(tl, "#s4-wrap", 26);
        hfSlide(tl, "#s4-kicker", 0.2, -30);
        hfSlide(tl, "#s4-title", 0.35, -30);
        tl.fromTo(
          ["#s4-ln-br", "#s4-ln-api", "#s4-ln-rd", "#s4-ln-wk", "#s4-ln-db"],
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 },
          0.4,
        );
        // the API is finished with this job: dim its lane
        tl.to("#s4-ln-api", { opacity: 0.4, duration: 0.6, ease: "power1.inOut" }, 1.4);
        hfPop(tl, "#s4-queue", 0.7);

        // the job id leaves the queue for the worker
        tl.to("#s4-token", { opacity: 0, y: -10, duration: 0.3, ease: "power1.in" }, 2.8);
        hfPacket(tl, "#s4-pk-id", [790, 400], [1000, 320], 2.8, 0.8);
        tl.fromTo("#s4-exec-sig", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.5);
        tl.to("#s4-queue", { opacity: 0.45, duration: 0.5, ease: "power1.inOut" }, 4.0);

        // 1. get the row
        hfSlide(tl, "#s4-st0", 5.2, 40);
        hfActivate(tl, "#s4-st0", 5.5, GREEN, 7.4);
        hfDraw(tl, "#s4-w-get", 5.6, 0.4);
        tl.to("#s4-w-get", { opacity: 0.3, duration: 0.4, ease: "power1.inOut" }, 7.4);
        hfPop(tl, "#s4-t-jobs", 5.8, { x: 30 });
        // 2. pre_claim kill switch (evals only)
        hfSlide(tl, "#s4-st1", 7.4, 40);
        hfActivate(tl, "#s4-st1", 7.7, GREEN, 9.6);

        // 3. claim: pending -> running, attempt +1
        hfSlide(tl, "#s4-st2", 9.6, 40);
        hfActivate(tl, "#s4-st2", 9.9, GREEN, 15.0);
        hfDraw(tl, "#s4-w-claim", 10.0, 0.5);
        tl.to("#s4-w-claim", { opacity: 0.3, duration: 0.4, ease: "power1.inOut" }, 15.0);
        tl.fromTo("#s4-pend", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 10.7);
        tl.fromTo("#s4-run", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 10.75);
        hfFlash(tl, "#s4-t-jobs", 10.7);
        hfPop(tl, "#s4-co1", 11.2, { x: -30 });
        tl.to("#s4-co1", { opacity: 0, duration: 0.4, ease: "power1.in" }, 14.7);

        // 4. load data, refresh matter, commit: the list shows running
        hfSlide(tl, "#s4-st3", 15.0, 40);
        hfActivate(tl, "#s4-st3", 15.3, GREEN, 19.0);
        hfDraw(tl, "#s4-w-load", 15.6, 0.5);
        tl.to("#s4-w-load", { opacity: 0.3, duration: 0.4, ease: "power1.inOut" }, 19.0);
        hfPop(tl, "#s4-t-mt", 16.1, { x: 30 });
        hfPop(tl, "#s4-b-list", 16.8, { x: -30 });

        // 5. trace span + progress feed + heartbeat
        hfSlide(tl, "#s4-st4", 19.0, 40);
        hfActivate(tl, "#s4-st4", 19.3, GREEN, 22.6);
        hfPop(tl, "#s4-t-ev", 19.5, { x: 30 });
        hfDraw(tl, "#s4-w-ev", 19.7, 0.4);
        tl.fromTo(
          "#s4-t-ev .s4-evr",
          { opacity: 0, x: 20 },
          { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", stagger: 1.4 },
          20.0,
        );
        hfPop(tl, "#s4-b-prog", 20.2, { x: -30 });
        tl.fromTo("#s4-bar", { scaleX: 0.05 }, { scaleX: 0.7, duration: 5.2, ease: "power1.out" }, 20.3);
        // heartbeat: one pulse per second stands in for "every 30 s" (finite repeat)
        tl.fromTo(
          "#s4-heart",
          { scale: 1 },
          { scale: 1.6, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 11, repeatDelay: 0.25 },
          19.6,
        );

        // 6. execute: the job's own work under bill_to
        hfSlide(tl, "#s4-st5", 22.6, 40);
        hfActivate(tl, "#s4-st5", 22.9, GREEN);
        hfPop(tl, "#s4-co2", 23.0, { x: -30 });

        hfCaps(tl, "#s4-wrap");
        window.__timelines["s4-claim"] = tl;
        })();
      </script>
    </template>
