              // fade each caption in at data-in and out at data-out (scene-local seconds)
      function hfCaps(tl, root) {
        document.querySelectorAll(root + " .cap").forEach((c) => {
          const a = parseFloat(c.dataset.in);
          const b = parseFloat(c.dataset.out);
          tl.fromTo(c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, a);
          tl.to(c, { opacity: 0, y: -8, duration: 0.3, ease: "power1.in" }, b - 0.3);
        });
      }
      // draw an svg wire (pathLength=1) from nothing to full
      function hfDraw(tl, sel, t, dur) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur || 0.6, ease: "power2.inOut" }, t);
      }
      // spring a card into place
      function hfPop(tl, sel, t, from) {
        tl.fromTo(
          sel,
          Object.assign({ opacity: 0, scale: 0.9, y: 18 }, from || {}),
          { opacity: 1, scale: 1, y: 0, x: 0, duration: 0.55, ease: "back.out(1.6)" },
          t,
        );
      }
      // slide a row / step in from the left
      function hfSlide(tl, sel, t, dx) {
        tl.fromTo(sel, { opacity: 0, x: dx || -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
      }
      // fade the whole scene in at the start and out before its slot ends
      function hfScene(tl, wrap, dur) {
        tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
        tl.to(wrap, { opacity: 0, duration: 0.5, ease: "power1.in" }, dur - 0.55);
      }
      // carry a labelled packet from one point to another (authored pixel constants)
      function hfPacket(tl, sel, a, b, t, dur) {
        const d = dur || 0.8;
        tl.fromTo(sel, { x: a[0], y: a[1] - 20 }, { x: b[0], y: b[1] - 20, duration: d, ease: "power2.inOut" }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, t);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "none" }, t + d);
      }
      // pulse a card border to show it was just written
      function hfFlash(tl, sel, t, from, to) {
        tl.fromTo(
          sel,
          { borderColor: from || "#3a5f99" },
          { borderColor: to || "#bfe0ff", duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false },
          t,
        );
      }
      // mark a step card active (amber/green border) and release the previous one
      function hfActivate(tl, sel, t, color, until) {
        tl.fromTo(sel, { borderColor: "#2a3d63" }, { borderColor: color, duration: 0.3, ease: "power1.out", immediateRender: false }, t);
        if (until) tl.to(sel, { borderColor: "#2a3d63", duration: 0.3, ease: "power1.in" }, until);
      }

        // scene 3: browser button -> plan -> insert (the lock) -> policies -> run row -> matter -> commit -> enqueue
        const tl = gsap.timeline({ paused: true });
        const AMBER = "#f5b544";
        hfScene(tl, "#s3-wrap", 44);
        hfSlide(tl, "#s3-kicker", 0.2, -30);
        hfSlide(tl, "#s3-title", 0.35, -30);
        tl.fromTo(
          ["#s3-ln-br", "#s3-ln-api", "#s3-ln-rd", "#s3-ln-wk", "#s3-ln-db"],
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 },
          0.5,
        );
        // the worker lane stays dim: nothing happens there yet
        tl.to("#s3-ln-wk", { opacity: 0.4, duration: 0.6, ease: "power1.inOut" }, 1.6);
        tl.set("#s3-post", { opacity: 0 }, 0);

        // cursor glides to the button and clicks; a POST packet leaves for the API
        hfPop(tl, "#s3-btn", 1.2);
        tl.fromTo("#s3-cursor", { x: 220, y: 470, opacity: 0 }, { x: 160, y: 330, opacity: 1, duration: 1.0, ease: "power2.out" }, 1.6);
        tl.fromTo("#s3-btn", { scale: 1 }, { scale: 0.92, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, 2.7);
        tl.to("#s3-cursor", { opacity: 0, duration: 0.4, ease: "power1.in" }, 4.2);
        hfPacket(tl, "#s3-pk-post", [170, 330], [300, 250], 3.0, 0.7);
        tl.fromTo("#s3-post", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 3.6);

        // 1. plan + check (read-only)
        hfSlide(tl, "#s3-st0", 5.6);
        hfActivate(tl, "#s3-st0", 5.9, AMBER, 10.2);

        // 2. INSERT jobs: the insert is the lock
        hfSlide(tl, "#s3-st1", 10.2);
        hfActivate(tl, "#s3-st1", 10.5, AMBER, 15.2);
        hfPacket(tl, "#s3-pk-ins", [720, 392], [1340, 300], 10.6, 0.9);
        hfPop(tl, "#s3-t-jobs", 11.3, { x: 30 });
        hfPop(tl, "#s3-lock", 12.6);

        // 3. a second insert bounces off the unique index; the policy callout explains the outcomes
        hfSlide(tl, "#s3-st2", 15.2);
        hfActivate(tl, "#s3-st2", 15.5, AMBER, 21.6);
        tl.fromTo("#s3-ghost", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 15.5);
        tl.fromTo("#s3-ghost", { x: 0 }, { x: 12, duration: 0.07, yoyo: true, repeat: 5, ease: "power1.inOut", immediateRender: false }, 16.0);
        hfPop(tl, "#s3-co1", 16.2, { x: -30 });
        tl.fromTo(
          "#s3-co1 .co-r",
          { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.9 },
          16.8,
        );
        tl.to(["#s3-co1", "#s3-ghost"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 21.3);

        // 4. the job's own run row
        hfSlide(tl, "#s3-st3", 21.6);
        hfActivate(tl, "#s3-st3", 21.9, AMBER, 26.0);
        hfPacket(tl, "#s3-pk-row", [720, 536], [1340, 590], 22.0, 0.9);
        hfPop(tl, "#s3-t-an", 22.7, { x: 30 });

        // 5. the matter's cached summary, same transaction
        hfSlide(tl, "#s3-st4", 26.0);
        hfActivate(tl, "#s3-st4", 26.3, AMBER, 30.4);
        hfPacket(tl, "#s3-pk-upd", [720, 608], [1330, 700], 26.4, 0.9);
        hfPop(tl, "#s3-t-mt", 27.1, { x: 30 });

        // 6. COMMIT: the three tables flash together and the commit bar sweeps in
        hfSlide(tl, "#s3-st5", 30.4);
        hfActivate(tl, "#s3-st5", 30.7, "#5ea2ff", 34.4);
        tl.fromTo("#s3-commitbar", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.inOut" }, 30.9);
        hfFlash(tl, ["#s3-t-jobs", "#s3-t-an", "#s3-t-mt"], 31.4);

        // 7. only the job id goes to Redis
        hfSlide(tl, "#s3-st6", 34.4);
        hfActivate(tl, "#s3-st6", 34.7, "#ff7a6b", 38.8);
        hfPop(tl, "#s3-queue", 34.6);
        hfPacket(tl, "#s3-pk-id", [700, 752], [776, 400], 35.1, 0.8);
        tl.fromTo("#s3-token", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "bounce.out" }, 35.8);
        hfSlide(tl, "#s3-qnote", 36.4, -16);
        // the idle worker lane perks up: there is work waiting
        tl.to("#s3-ln-wk", { opacity: 0.75, duration: 0.6, ease: "power1.inOut" }, 36.8);

        // 8. queue id saved; then the queue-down branch
        hfSlide(tl, "#s3-st7", 38.8);
        hfActivate(tl, "#s3-st7", 39.1, AMBER);
        hfPacket(tl, "#s3-pk-qid", [720, 824], [1340, 389], 39.1, 0.9);
        tl.fromTo("#s3-qid-old", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 39.9);
        tl.fromTo("#s3-qid-new", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 40.0);
        tl.to("#s3-ln-wk", { opacity: 1, duration: 0.3, ease: "none" }, 40.3);
        hfPop(tl, "#s3-co2", 40.4, { x: -30 });

        hfCaps(tl, "#s3-wrap");
        window.__timelines["s3-start"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
