<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0b1426;
        }
      /* persistent background layer: grid, two drifting glows, a chapter progress rail */
      #bg-wrap {
        position: absolute;
        inset: 0;
      }
      #bg-grid {
        position: absolute;
        inset: -80px;
        background-image:
          linear-gradient(rgba(94, 162, 255, 0.07) 2px, transparent 2px),
          linear-gradient(90deg, rgba(94, 162, 255, 0.07) 2px, transparent 2px);
        background-size: 80px 80px;
      }
      .bg-glow {
        position: absolute;
        border-radius: 50%;
        width: 1100px;
        height: 1100px;
      }
      #bg-glow-a {
        left: -360px;
        top: -420px;
        background: radial-gradient(circle, rgba(94, 162, 255, 0.2) 0%, rgba(94, 162, 255, 0) 65%);
      }
      #bg-glow-b {
        right: -380px;
        bottom: -460px;
        background: radial-gradient(circle, rgba(62, 213, 152, 0.14) 0%, rgba(62, 213, 152, 0) 65%);
      }
      #bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(11, 20, 38, 0) 55%, rgba(5, 10, 22, 0.75) 100%);
      }
      #bg-rail {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 1920px;
        height: 6px;
        background: rgba(42, 61, 99, 0.6);
      }
      #bg-rail-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 6px;
        background: #5ea2ff;
        transform-origin: 0 50%;
      }
      </style>
      <div id="root" data-composition-id="bg" data-width="1920" data-height="1080">
        <div id="bg-wrap">
          <div id="bg-grid"></div>
          <div id="bg-glow-a" class="bg-glow"></div>
          <div id="bg-glow-b" class="bg-glow"></div>
          <div id="bg-vignette"></div>
          <div id="bg-rail"><div id="bg-rail-fill"></div></div>
        </div>
      </div>
      <script>
        (function () {
          // slow drift of grid and glows, and a progress rail across the whole film
          const tl = gsap.timeline({ paused: true });
          const TOTAL = 190;
          tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: 80, y: 80, duration: TOTAL, ease: "none" }, 0);
          // glows breathe on a 10s cycle; finite repeat count that ends inside the film
          const CYCLE = 10;
          const reps = Math.max(0, Math.floor(TOTAL / CYCLE) - 1);
          tl.fromTo(
            "#bg-glow-a",
            { scale: 1, x: 0 },
            { scale: 1.18, x: 120, duration: CYCLE / 2, ease: "sine.inOut", yoyo: true, repeat: reps },
            0,
          );
          tl.fromTo(
            "#bg-glow-b",
            { scale: 1.15, y: 0 },
            { scale: 1, y: -100, duration: CYCLE / 2, ease: "sine.inOut", yoyo: true, repeat: reps },
            0,
          );
          tl.fromTo("#bg-rail-fill", { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: "none" }, 0);
          window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
