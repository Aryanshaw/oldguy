          const b = parseFloat(c.dataset.out);

      // spring a card into place

          sel,

      function hfScene(tl, wrap, dur) {

        // the copies flash together to show they are the same code
        tl.fromTo(
          "#s1-before .s1-strip",
          { borderColor: "#4a5e85" },
          { borderColor: "#ff7a6b", duration: 0.25, yoyo: true, repeat: 3, ease: "power1.inOut" },
          7.4,
        );
        hfPop(tl, "#s1-stat-a", 8.6);
        hfPop(tl, "#s1-stat-b", 9.2);
        // before panel steps back once the after panel arrives
        tl.to("#s1-before", { opacity: 0.45, duration: 0.6, ease: "power1.inOut" }, 11.6);

        // after: seven specs, wires converge, then planner and runner
        hfPop(tl, "#s1-after", 11.6, { x: 40 });
        hfSlide(tl, "#s1-after .s1-ph", 11.8);
        tl.fromTo(
          "#s1-after .s1-spec",
          { opacity: 0, x: -24 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.07 },
          12.0,
        );
        ["#s1-w0", "#s1-w1", "#s1-w2", "#s1-w3", "#s1-w4", "#s1-w5", "#s1-w6"].forEach((w, i) =>
          hfDraw(tl, w, 12.7 + i * 0.05, 0.6),
        );
        hfDraw(tl, "#s1-wp", 13.4, 0.5);
        hfDraw(tl, "#s1-wr", 13.6, 0.5);
        hfPop(tl, "#s1-planner", 13.8, { x: 30 });
        hfPop(tl, "#s1-runner", 14.2, { x: 30 });
        hfSlide(tl, "#s1-sum", 15.0, -20);

        hfCaps(tl, R);
        window.__timelines["s1-intro"] = tl;
        })();
      </script>
    </template>
