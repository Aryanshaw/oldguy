        (function () {
              // fade each caption in at data-in and out at data-out (scene-local seconds)
      function hfCaps(tl, root) {
        document.querySelectorAll(root + " .cap").forEach((c) => {
          const a = parseFloat(c.dataset.in);
          const b = parseFloat(c.dataset.out);
          tl.fromTo(c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, a);
          tl.to(c, { opacity: 0, y: -8, duration: 0.3, ease: "power1.in" }, b - 0.3);
        });
      }
      // draw an svg wire (pathLength=1) from nothing to full
      function hfDraw(tl, sel, t, dur) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur || 0.6, ease: "power2.inOut" }, t);
      }
      // spring a card into place
      function hfPop(tl, sel, t, from) {
        tl.fromTo(
          sel,
          Object.assign({ opacity: 0, scale: 0.9, y: 18 }, from || {}),
          { opacity: 1, scale: 1, y: 0, x: 0, duration: 0.55, ease: "back.out(1.6)" },
          t,
        );
      }
      // slide a row / step in from the left
      function hfSlide(tl, sel, t, dx) {
        tl.fromTo(sel, { opacity: 0, x: dx || -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
      }
      // fade the whole scene in at the start and out before its slot ends
      function hfScene(tl, wrap, dur) {
        tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
        tl.to(wrap, { opacity: 0, duration: 0.5, ease: "power1.in" }, dur - 0.55);
      }
      // carry a labelled packet from one point to another (authored pixel constants)
      function hfPacket(tl, sel, a, b, t, dur) {
        const d = dur || 0.8;
        tl.fromTo(sel, { x: a[0], y: a[1] - 20 }, { x: b[0], y: b[1] - 20, duration: d, ease: "power2.inOut" }, t);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, t);
        tl.to(sel, { opacity: 0, duration: 0.2, ease: "none" }, t + d);
      }
      // pulse a card border to show it was just written
      function hfFlash(tl, sel, t, from, to) {
        tl.fromTo(
          sel,
          { borderColor: from || "#3a5f99" },
          { borderColor: to || "#bfe0ff", duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false },
          t,
        );
      }
      // mark a step card active (amber/green border) and release the previous one
      function hfActivate(tl, sel, t, color, until) {
        tl.fromTo(sel, { borderColor: "#2a3d63" }, { borderColor: color, duration: 0.3, ease: "power1.out", immediateRender: false }, t);
        if (until) tl.to(sel, { borderColor: "#2a3d63", duration: 0.3, ease: "power1.in" }, until);
      }

        // scene 5: run.finish() writes -> COMMIT -> publish -> after_terminal
        const tl = gsap.timeline({ paused: true });
        hfScene(tl, "#s5-wrap", 28);
        hfSlide(tl, "#s5-kicker", 0.2, -30);
        hfSlide(tl, "#s5-title", 0.35, -30);
        tl.fromTo(
          ["#s5-ln-br", "#s5-ln-api", "#s5-ln-rd", "#s5-ln-wk", "#s5-ln-db"],
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 },
          0.4,
        );
        tl.to("#s5-ln-api", { opacity: 0.4, duration: 0.6, ease: "power1.inOut" }, 1.3);
        tl.fromTo("#s5-wk-sig", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.0);
        hfPop(tl, "#s5-frame", 1.4);
        tl.set(".s5-row", { opacity: 0 }, 0);

        // each line inside finish() ticks on and its table lights up
        const rows = document.querySelectorAll("#s5-frame .s5-row");
        const writes = [
          [5.8, null, null],
          [7.0, "#s5-w1", "#s5-t-an"],
          [8.4, "#s5-w2", "#s5-t-bill"],
          [10.8, "#s5-w3", "#s5-t-jobs"],
          [12.0, "#s5-w4", "#s5-t-mt"],
          [13.2, "#s5-w5", "#s5-t-ev"],
        ];
        writes.forEach(([t, wire, table], i) => {
          tl.fromTo(rows[i], { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, t);
          if (wire) hfDraw(tl, wire, t + 0.2, 0.35);
          if (table) hfPop(tl, table, t + 0.45, { x: 24 });
        });
        // the job's status flips inside the same transaction
        tl.fromTo("#s5-run", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 11.6);
        tl.fromTo("#s5-ok", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 11.65);

        // COMMIT: both bars sweep, every table flashes, the frame locks
        tl.fromTo("#s5-commit-wk", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.inOut" }, 14.9);
        tl.fromTo("#s5-commit-db", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.inOut" }, 15.1);
        hfFlash(tl, ["#s5-t-an", "#s5-t-bill", "#s5-t-jobs", "#s5-t-mt", "#s5-t-ev"], 15.6);
        tl.fromTo("#s5-commit-wk", { scale: 1 }, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 16.0);

        // publish: worker -> Redis pub/sub -> browser, only after the commit
        hfSlide(tl, "#s5-st-pub", 19.0, 40);
        hfActivate(tl, "#s5-st-pub", 19.3, "#ff7a6b", 23.2);
        hfPop(tl, "#s5-pubsub", 19.2);
        hfDraw(tl, "#s5-w-pub", 19.5, 0.4);
        hfFlash(tl, "#s5-pubsub", 19.9, "#ff7a6b", "#ffd0c9");
        hfPacket(tl, "#s5-pk-sse", [700, 720], [90, 620], 20.4, 0.9);
        hfPop(tl, "#s5-sse", 21.4, { x: -30 });

        // after_terminal: follow-ups for how the job ended
        hfSlide(tl, "#s5-st-after", 23.2, 40);
        hfActivate(tl, "#s5-st-after", 23.5, "#3ed598");
        hfPop(tl, "#s5-co", 23.4, { x: -30 });
        tl.fromTo(
          "#s5-co .co-r",
          { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.5 },
          24.0,
        );

        hfCaps(tl, "#s5-wrap");
        window.__timelines["s5-finish"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
