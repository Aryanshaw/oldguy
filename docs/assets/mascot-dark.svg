<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Yap's mascot: a cheerful wind-up alarm clock">
  <g stroke="#FFF1CC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- feet -->
    <path d="M44 112l-10 16h14M96 112l10 16H92" fill="none"/>
    <!-- wind-up key -->
    <path d="M110 74h9" fill="none"/>
    <rect x="119" y="58" width="12" height="32" rx="6" fill="#FF8A1F"/>
    <!-- bell stalks and striker -->
    <path d="M44 36l-8-9M96 36l8-9M70 26V12" fill="none"/>
    <circle cx="70" cy="10" r="4" fill="#FFF1CC"/>
    <!-- bells: domes tilted outward -->
    <path d="M14 30a22 22 0 0 1 34-22z" fill="#FF8A1F" transform="rotate(-8 31 19)"/>
    <path d="M126 30a22 22 0 0 0-34-22z" fill="#FF8A1F" transform="rotate(8 109 19)"/>
    <!-- body and dial -->
    <circle cx="70" cy="74" r="42" fill="#F6C945"/>
    <circle cx="70" cy="74" r="31" fill="#FFF1CC" stroke="#14110A" stroke-width="4"/>
  </g>
  <!-- ticks at 3, 6 and 9 -->
  <g stroke="#FF8A1F" stroke-width="4" stroke-linecap="round">
    <path d="M45 74h5M90 74h5M70 99v4"/>
  </g>
  <!-- face -->
  <circle cx="60" cy="62" r="4.5" fill="#14110A"/>
  <circle cx="80" cy="62" r="4.5" fill="#14110A"/>
  <path d="M58 84q12 10 24 0" fill="none" stroke="#14110A" stroke-width="4" stroke-linecap="round"/>
  <!-- hands -->
  <g stroke="#14110A" stroke-width="3.5" stroke-linecap="round">
    <path d="M70 74V50M70 74l10 5"/>
  </g>
  <circle cx="70" cy="74" r="3.5" fill="#14110A"/>
</svg>
